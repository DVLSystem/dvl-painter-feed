<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DVL Painter Feed</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <meta name="description" content="해외 미니어처 페인터들의 최신 영상과 레퍼런스를 한곳에서 보는 개인용 피드 허브" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">DVL SYSTEM</div>
        <h1>DVL PAINTER FEED</h1>
      </div>
      <div class="top-actions">
        <button id="refreshBtn" class="icon-btn" title="새로고침">↻</button>
        <button id="themeBtn" class="icon-btn" title="테마 변경">◐</button>
      </div>
    </header>

    <section class="toolbar">
      <div class="search-wrap">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="페인터, 태그, 제목 검색" autocomplete="off" />
      </div>
      <div id="sourceFilters" class="filter-row"></div>
      <div id="tagFilters" class="filter-row tag-row"></div>
      <div id="ageFilters" class="filter-row age-row">
        <button class="filter-btn active" data-age="ALL">전체 기간</button>
        <button class="filter-btn" data-age="1">24시간</button>
        <button class="filter-btn" data-age="3">3일</button>
        <button class="filter-btn" data-age="7">7일</button>
      </div>
    </section>

    <main>
      <section class="hero-panel">
        <div>
          <p class="muted">FOLLOWING</p>
          <h2 id="summaryTitle">오늘의 페인팅 업데이트</h2>
          <p id="summaryText" class="muted">YouTube · ArtStation · 공식 사이트 업데이트를 한곳에서 확인하세요.</p>
          <div id="sourceSummary" class="source-summary"></div>
        </div>
        <div class="hero-stat">
          <strong id="newCount">0</strong>
          <span>24H NEW</span>
        </div>
      </section>

      <section class="content-grid">
        <aside class="painters-panel panel">
          <div class="panel-heading">
            <h3>PAINTERS</h3>
            <button id="showAllPainters" class="text-btn">ALL</button>
          </div>
          <div id="paintersList" class="painters-list"></div>
        </aside>

        <section class="feed-panel panel">
          <div class="panel-heading feed-heading">
            <div>
              <h3>LATEST FEED</h3>
              <p id="feedStatus" class="muted small"></p>
            </div>
            <div class="feed-controls">
              <div class="view-tabs" aria-label="피드 종류">
                <button class="tab active" data-view="latest">LATEST</button>
                <button class="tab" data-view="saved">SAVED</button>
              </div>
              <div class="display-tabs" aria-label="보기 방식">
                <button class="display-btn active" data-display="list" title="리스트 보기">☰ <span>LIST</span></button>
                <button class="display-btn" data-display="gallery" title="갤러리 보기">▦ <span>GALLERY</span></button>
              </div>
            </div>
          </div>
          <div id="feedList" class="feed-list list-view"></div>
          <div id="emptyState" class="empty-state hidden">
            <div class="empty-icon">✦</div>
            <h3>표시할 항목이 없습니다</h3>
            <p>검색어나 필터를 바꿔보세요.</p>
          </div>
        </section>
      </section>
    </main>
  </div>

  <div id="profileBackdrop" class="profile-backdrop hidden"></div>
  <aside id="profileDrawer" class="profile-drawer" aria-hidden="true">
    <button id="closeProfileBtn" class="drawer-close" title="닫기">×</button>
    <div id="painterProfile"></div>
  </aside>

  <template id="feedCardTemplate">
    <article class="feed-card">
      <a class="thumb-wrap" target="_blank" rel="noopener noreferrer">
        <img class="thumb" alt="" loading="lazy" />
        <span class="source-badge"></span>
        <span class="fresh-badge hidden"></span>
      </a>
      <div class="card-body">
        <div class="card-topline">
          <button class="painter-link"></button>
          <time class="date"></time>
        </div>
        <a class="title" target="_blank" rel="noopener noreferrer"></a>
        <p class="description"></p>
        <div class="tag-list"></div>
        <div class="card-actions">
          <button class="save-btn">☆ SAVE</button>
          <a class="open-link" target="_blank" rel="noopener noreferrer">OPEN ↗</a>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10151a">
  <title>DVL Painter Feed</title>
  <link rel="icon" href="assets/icon.png" onerror="this.remove()">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">DVL SYSTEM</div>
      <h1>DVL PAINTER FEED</h1>
      <div id="lastUpdated" class="muted">마지막 업데이트: 확인 중…</div>
    </div>
    <div class="top-actions">
      <button id="manageBtn" class="ghost">⚙ MANAGE</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="feed">FEED</button>
    <button class="tab" data-view="saved">SAVED</button>
  </nav>

  <main class="layout">
    <aside class="sidebar card">
      <input id="search" class="search" placeholder="Search painter / title / tag">
      <div class="section-title">PAINTERS</div>
      <div id="painterList" class="painter-list"></div>
    </aside>

    <section class="content">
      <div class="filters card">
        <div id="sourceFilters" class="chips"></div>
        <div id="rangeFilters" class="chips">
          <button class="chip active" data-range="all">ALL TIME</button>
          <button class="chip" data-range="1">24H</button>
          <button class="chip" data-range="3">3D</button>
          <button class="chip" data-range="7">7D</button>
        </div>
        <div id="tagFilters" class="chips tags"></div>
      </div>

      <div class="feed-head">
        <div><strong id="viewTitle">LATEST FEED</strong> <span id="countBadge" class="badge">0</span></div>
      </div>

      <div id="feed" class="feed"></div>
      <div id="empty" class="empty hidden">표시할 피드가 없습니다.</div>
    </section>
  </main>

  <dialog id="manager">
    <form method="dialog" class="manager card">
      <div class="manager-head">
        <div><div class="eyebrow">ADMIN</div><h2>PAINTER MANAGER</h2></div>
        <button value="cancel" class="ghost">✕</button>
      </div>
      <p class="muted">브라우저에서 편집 후 GitHub에 게시할 수 있습니다. GitHub 토큰은 저장하지 않습니다.</p>
      <div id="managerList"></div>
      <div class="manager-actions">
        <button type="button" id="addPainter">+ ADD PAINTER</button>
        <button type="button" id="saveLocal" class="ghost">SAVE LOCALLY</button>
        <button type="button" id="publishGithub">PUBLISH TO GITHUB</button>
      </div>
      <details>
        <summary>GitHub publish settings</summary>
        <div class="formgrid settings">
          <label>Owner<input id="ghOwner" value="dvlsystem"></label>
          <label>Repository<input id="ghRepo" value="dvl-painter-feed"></label>
          <label>Branch<input id="ghBranch" value="main"></label>
          <label class="span2">Fine-grained token<input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_…"></label>
        </div>
      </details>
      <div id="managerStatus" class="muted"></div>
    </form>
  </dialog>

  <template id="painterEditorTpl">
    <div class="editor">
      <div class="formgrid">
        <label>Name<input data-k="name"></label>
        <label>Country<input data-k="country"></label>
        <label class="span2">YouTube URL<input data-k="youtubeUrl" placeholder="https://youtube.com/@handle"></label>
        <label class="span2">Website<input data-k="website"></label>
        <label>Instagram<input data-k="instagram"></label>
        <label>Patreon<input data-k="patreon"></label>
        <label class="span2">Specialties <small>(comma separated)</small><input data-k="specialties"></label>
        <label>Website mode
          <select data-k="websiteMode">
            <option value="none">none</option>
            <option value="auto">auto</option>
            <option value="rss">rss</option>
            <option value="sitemap">sitemap</option>
          </select>
        </label>
        <label class="toggle">Active <input type="checkbox" data-k="active"></label>
      </div>
      <button type="button" class="danger removePainter">DELETE</button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
